name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish current package.json version to npm (requires matching git tag on this commit)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Run tests
        run: bun test

      - name: Typecheck
        run: bunx tsc --noEmit
        continue-on-error: true

      - name: Pack dry-run
        run: npm pack --dry-run

      - name: Release gate (dry-run, no tag)
        if: github.event_name != 'pull_request'
        run: bun scripts/release.mjs --checks version,pack

  publish:
    name: Publish to npm
    needs: test
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Re-run tests before publish
        run: bun test

      - name: Resolve publish version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [[ "$TAG" != "$PKG" ]]; then
              echo "Tag v$TAG does not match package.json version $PKG"
              exit 1
            fi
          else
            EXPECTED="v${PKG}"
            if ! git rev-parse -q --verify "refs/tags/${EXPECTED}" >/dev/null; then
              echo "Manual publish requires git tag ${EXPECTED} to exist on this commit"
              exit 1
            fi
            HEAD="$(git rev-parse HEAD)"
            TAG_COMMIT="$(git rev-list -n 1 "${EXPECTED}")"
            if [[ "$HEAD" != "$TAG_COMMIT" ]]; then
              echo "Tag ${EXPECTED} points at ${TAG_COMMIT}, not HEAD ${HEAD}"
              exit 1
            fi
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          echo "Publishing ${NAME}@${PKG}"

      - name: Skip if version already on npm
        id: exists
        shell: bash
        run: |
          set -euo pipefail
          NAME="${{ steps.ver.outputs.name }}"
          VER="${{ steps.ver.outputs.version }}"
          if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${NAME}@${VER} already published; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.exists.outputs.exists != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        shell: bash
        run: |
          NAME="${{ steps.ver.outputs.name }}"
          VER="${{ steps.ver.outputs.version }}"
          {
            echo "## npm publish"
            echo ""
            echo "- package: \`${NAME}@${VER}\`"
            echo "- registry: https://www.npmjs.com/package/${NAME}"
            echo "- install: \`pi install npm:${NAME}\`"
            echo "- catalog (after discovery): https://pi.dev/packages/${NAME}"
            if [[ "${{ steps.exists.outputs.exists }}" == "true" ]]; then
              echo "- status: already published (no-op)"
            else
              echo "- status: published (or attempted)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
